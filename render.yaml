# Render Blueprint for the "I'm Dead" backend.
#
# Deploy: push this repo to GitHub/GitLab, then in Render pick "New +" ->
# "Blueprint" and point it at the repo. Render reads this file and provisions
# the service and its disk. On first deploy you'll be prompted to fill in the
# two secret API keys below (they have sync: false, so they are never stored in
# git).
#
# State lives on the attached persistent disk mounted at /data, so consent
# records and ghost PNGs survive deploys and restarts — the same per-session
# directory layout the local backend uses, just on a durable disk.

services:
  - type: web
    name: imdead-backend
    runtime: python
    plan: starter            # a disk requires a paid instance; free can't mount one
    region: oregon           # change to your nearest region if you like
    # uv provisions Python 3.13 (per pyproject) and installs from the frozen lock.
    buildCommand: pip install uv && uv sync --frozen
    # gunicorn in place of Flask's dev server. One worker: the clone/ghost work is
    # slow and synchronous, and the disk pins us to a single instance anyway.
    # 120s timeout so a long ghost/clone request doesn't trip the worker timeout.
    startCommand: uv run gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    disk:
      name: imdead-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Per-session storage root -> the mounted disk (storage.py reads DATA_DIR).
      - key: DATA_DIR
        value: /data
      # Secrets: set these in the Render dashboard on first deploy.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Optional: uncomment to pin a data-zone TTS host.
      # - key: ASSEMBLYAI_TTS_HOST
      #   value: https://tts.us.assemblyai.com
