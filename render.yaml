services:
  # Flask API Server
  - type: web
    name: expertavatar-api
    env: python
    region: oregon
    plan: free  # or starter ($7/month)
    buildCommand: pip install -r requirements.txt
    # Bind to 0.0.0.0:$PORT (Render provides PORT automatically, usually 10000)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      # Core required keys
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Set in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # Set in Render dashboard
      - key: HEDRA_API_KEY
        sync: false  # Set in Render dashboard
      - key: CARTESIA_API_KEY
        sync: false  # Set in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Required for cartoon/illustration generation via Gemini
      - key: BACKEND_API_KEY
        sync: false  # Set in Render dashboard - shared secret for agent authentication
      # Payment features (Stripe) - Optional
      - key: STRIPE_SECRET_KEY
        sync: false  # Optional - required for paid features
      - key: STRIPE_PRICE_ID
        sync: false  # Optional - Stripe price ID for subscription product
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Optional - required for Stripe webhooks
      # Email notifications (Resend) - Optional
      - key: RESEND_API_KEY
        sync: false  # Optional - required for email notifications
      - key: RESEND_FROM_EMAIL
        sync: false  # Optional - defaults to "Expert Avatar <hello@notifications.melochora.com>"
      - key: SUPPORT_EMAIL
        sync: false  # Optional - defaults to "support@melochora.com"
      # App configuration
      - key: APP_URL
        sync: false  # Your app domain - defaults to "https://expertavatar.com"
      # Voice provider config - Optional
      - key: VOICE_PROVIDER
        value: inworld  # or "cartesia"
      - key: INWORLD_API_KEY
        sync: false  # Optional - if using Inworld for voice
      - key: INWORLD_WORKSPACE_ID
        sync: false  # Optional - if using Inworld for voice
    healthCheckPath: /health

  # Background Worker for Processing Jobs
  - type: worker
    name: expertavatar-worker
    env: python
    region: oregon
    plan: free  # or starter ($7/month)
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      # Core required keys
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Set in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # Set in Render dashboard
      - key: HEDRA_API_KEY
        sync: false  # Set in Render dashboard
      - key: CARTESIA_API_KEY
        sync: false  # Set in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Required for cartoon/illustration generation via Gemini
      # Payment features (Stripe) - Optional
      - key: STRIPE_SECRET_KEY
        sync: false  # Optional - required for paid features
      - key: STRIPE_PRICE_ID
        sync: false  # Optional - Stripe price ID for subscription product
      # Email notifications (Resend) - Optional
      - key: RESEND_API_KEY
        sync: false  # Optional - required for email notifications
      - key: RESEND_FROM_EMAIL
        sync: false  # Optional - defaults to "Expert Avatar <hello@notifications.melochora.com>"
      - key: SUPPORT_EMAIL
        sync: false  # Optional - defaults to "support@melochora.com"
      # App configuration
      - key: APP_URL
        sync: false  # Your app domain - defaults to "https://expertavatar.com"
      # Voice provider config - Optional
      - key: VOICE_PROVIDER
        value: inworld  # or "cartesia"
      - key: INWORLD_API_KEY
        sync: false  # Optional - if using Inworld for voice
      - key: INWORLD_WORKSPACE_ID
        sync: false  # Optional - if using Inworld for voice
      # Worker configuration
      - key: WORKER_POLL_INTERVAL
        value: 5  # Poll every 5 seconds
      - key: STUCK_JOB_TIMEOUT
        value: 30  # Reset jobs stuck for 30+ minutes

  # Next.js Frontend
  - type: web
    name: expertavatar-frontend
    env: node
    region: oregon
    plan: free  # or starter ($7/month)
    rootDir: expertavatar-interview/expertavatar-interview-frontend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set to your backend URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false
